name: Build OnePlus Pad 2 NetHunter Kernel (Snapdragon 8 Gen 3)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile OnePlus Pad 2 Kernel (SM8650)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository (Loads your custom configs)
        uses: actions/checkout@v4

      - name: Clone OnePlus Kernel Source
        run: |
          echo "Cloning OnePlus Pad 2 kernel branch..."
          git clone --depth=1 -b oneplus/sm8650_v_15.0.0_pad2 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8650 kernel_source
          
      - name: Copy Custom Configs into Kernel Source
        run: |
          echo "Copying custom NetHunter configs to the kernel source directory..."
          cp -r configs kernel_source/

      - name: Build Android Kernel with NetHunter and KernelSU-Next
        uses: dabao1955/kernel_build_action@main
        with:
          # Hardware Target - Pointing to the locally cloned directory
          kernel-url: ./kernel_source/
          config: gki_defconfig
          arch: arm64

          # Toolchain Setup
          llvm: true
          aosp-gcc: false
          android-version: 14
          aosp-clang-version: r487747c
          
          # Force compiler pipeline to use exclusive LLVM binary modules
          extra-cmd: LLVM=1 LLVM_IAS=1

          # KernelSU-Next Integration
          ksu: true
          ksu-other: true
          ksu-url: https://github.com/KernelSU-Next/KernelSU-Next
          ksu-version: main

          # NetHunter Support
          nethunter: true
          nethunter-patch: false

          # Merge custom kernel configs (now safely inside the kernel folder)
          merge-configs: |
            [
              "configs/nethunter-base.txt",
              "configs/nethunter-network.txt",
              "configs/snapdragon8-gen3-optimize.txt",
              "configs/security-hardening.txt"
            ]

          # Package as flashable AnyKernel3 zip
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
          
