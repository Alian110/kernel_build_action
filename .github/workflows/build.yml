name: Build OnePlus Pad 2 NetHunter Kernel (Bazel)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile OnePlus Pad 2 Kernel (SM8650)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository (Loads your custom configs)
        uses: actions/checkout@v4

      - name: Free Disk Space (Required for massive Bazel builds)
        run: |
          echo "Clearing up disk space for the massive build environment..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install Build Dependencies and Repo Tool
        run: |
          echo "Installing essential build tools and Google Repo..."
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          
      - name: Initialize and Sync OnePlus Kernel Manifest (Pure Local Setup)
        run: |
          echo "Setting up workspace using your local custom manifest..."
          
          # Dummy identities required by git to prevent crashing
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. Create a local Git repository to host our custom manifest
          mkdir local_manifest_repo
          cd local_manifest_repo
          git init
          # Copy your txt file and rename it directly to what the tool expects
          cp ../configs/oneplus_pad2_v.txt default.xml
          git add default.xml
          git commit -m "Custom OnePlus Pad 2 Manifest"
          cd ..
          
          # 2. Set up the workspace and point the repo tool directly at our local folder
          mkdir workspace
          cd workspace
          repo init -u ../local_manifest_repo
          
          # 3. Sync the source code using the optimized depth settings from your file
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
          
      - name: Patch KernelSU-Next
        run: |
          echo "Injecting KernelSU-Next..."
          cd workspace/kernel_platform/common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -



      - name: Inject Custom NetHunter Configurations
        run: |
          echo "Appending custom NetHunter tools to the master GKI configuration..."
          cd workspace
          cat ../configs/nethunter-base.txt >> kernel_platform/common/arch/arm64/configs/gki_defconfig
          cat ../configs/nethunter-network.txt >> kernel_platform/common/arch/arm64/configs/gki_defconfig
          cat ../configs/snapdragon8-gen3-optimize.txt >> kernel_platform/common/arch/arm64/configs/gki_defconfig
          cat ../configs/security-hardening.txt >> kernel_platform/common/arch/arm64/configs/gki_defconfig

      - name: Build Kernel with Bazel
        run: |
          echo "Starting Bazel compilation for Snapdragon 8 Gen 3 (Pineapple GKI)..."
          cd workspace
          ./kernel_platform/build_with_bazel.py -t pineapple gki


      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-Pad-2-Kernel-Output
          path: workspace/out/
          
