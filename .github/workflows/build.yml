name: Build OnePlus Pad 2 NetHunter Kernel (Snapdragon 8 Gen 3)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile OnePlus Pad 2 Kernel (SM8650)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Android Kernel with NetHunter and KernelSU-Next
        uses: dabao1955/kernel_build_action@main
        with:
          # Hardware Target - Fixed explicitly for OnePlus Open Source tree split
          kernel-url: https://github.com/OnePlusOSS/android_kernel_oneplus_sm8650
          kernel-branch: oneplus/sm8650_v_15.0.0_pad2
          config: gki_defconfig
          arch: arm64

          # Toolchain Setup
          llvm: true
          aosp-gcc: false
          android-version: 14
          aosp-clang-version: r487747c
          
          # Force compiler pipeline to use exclusive LLVM binary modules
          extra-cmd: LLVM=1 LLVM_IAS=1

          # KernelSU-Next Integration
          ksu: true
          ksu-other: true
          ksu-url: https://github.com/KernelSU-Next/KernelSU-Next
          ksu-version: main

          # NetHunter Support
          nethunter: true
          nethunter-patch: false

          # Merge custom kernel configs with ABSOLUTE paths
          merge-configs: |
            [
              "${{ github.workspace }}/configs/nethunter-base.txt",
              "${{ github.workspace }}/configs/nethunter-network.txt",
              "${{ github.workspace }}/configs/snapdragon8-gen3-optimize.txt",
              "${{ github.workspace }}/configs/security-hardening.txt"
            ]

          # Package as flashable AnyKernel3 zip
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
