name: Build OnePlus Pad 2 NetHunter Kernel (Bazel)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile OnePlus Pad 2 Kernel (SM8650)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Clearing up disk space for the massive build environment..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install Build Dependencies and Repo Tool
        run: |
          echo "Installing essential build tools and Google Repo..."
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
          
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          
          # Fix the "repo not found" warning by symlinking to the global binary path
          sudo ln -sf ~/.bin/repo /usr/bin/repo
          sudo ln -sf ~/.bin/repo /bin/repo

      - name: Initialize and Sync OnePlus Kernel Manifest (Pure Local Setup)
        run: |
          echo "Setting up workspace using your local custom manifest..."
          
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          mkdir local_manifest_repo
          cd local_manifest_repo
          git init
          cp ../configs/oneplus_pad2_v.txt default.xml
          git add default.xml
          git commit -m "Custom OnePlus Pad 2 Manifest"
          cd ..
          
          mkdir workspace
          cd workspace
          repo init -u ../local_manifest_repo
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Patch KernelSU-Next
        run: |
          echo "Injecting KernelSU-Next..."
          cd workspace/kernel_platform/common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Inject Custom NetHunter Configurations Safely
        run: |
          echo "Fixing GKI module requirements and injecting configs..."
          cd workspace/kernel_platform/common
          
          # 1. CRITICAL MODULE FIX: Force required features into loadable modules (=m) 
          # so Bazel can successfully package the expected .ko files at the end of the build.
          sed -i 's/CONFIG_VLAN_8021Q=y/CONFIG_VLAN_8021Q=m/g' ${{ github.workspace }}/configs/nethunter-network.txt
          sed -i 's/CONFIG_USB_USBNET=y/CONFIG_USB_USBNET=m/g' ${{ github.workspace }}/configs/nethunter-network.txt
          sed -i 's/CONFIG_USB_NET_CDC_EEM=y/CONFIG_USB_NET_CDC_EEM=m/g' ${{ github.workspace }}/configs/nethunter-base.txt
          sed -i 's/CONFIG_BT=y/CONFIG_BT=m/g' ${{ github.workspace }}/configs/nethunter-base.txt
          sed -i 's/CONFIG_BT_RFCOMM=y/CONFIG_BT_RFCOMM=m/g' ${{ github.workspace }}/configs/nethunter-base.txt
          sed -i 's/CONFIG_BT_HCIUART=y/CONFIG_BT_HCIUART=m/g' ${{ github.workspace }}/configs/nethunter-base.txt
          sed -i 's/CONFIG_CFG80211=y/CONFIG_CFG80211=m/g' ${{ github.workspace }}/configs/nethunter-base.txt
          sed -i 's/CONFIG_MAC80211=y/CONFIG_MAC80211=m/g' ${{ github.workspace }}/configs/nethunter-base.txt
          
          # 2. Append custom configs directly to the master GKI configuration
          cat ${{ github.workspace }}/configs/nethunter-base.txt >> arch/arm64/configs/gki_defconfig
          cat ${{ github.workspace }}/configs/nethunter-network.txt >> arch/arm64/configs/gki_defconfig
          cat ${{ github.workspace }}/configs/snapdragon8-gen3-optimize.txt >> arch/arm64/configs/gki_defconfig
          cat ${{ github.workspace }}/configs/security-hardening.txt >> arch/arm64/configs/gki_defconfig
          
          # 3. CRITICAL FIX: Disable Google's strict GKI defconfig check
          echo "Hunting down and disabling POST_DEFCONFIG_CMDS checks..."
          find . -type f -name "build.config*" -exec sed -i 's/POST_DEFCONFIG_CMDS="check_defconfig"/POST_DEFCONFIG_CMDS=""/g' {} +

      - name: Build Kernel with Bazel
        run: |
          echo "Starting Bazel compilation for Snapdragon 8 Gen 3 (Pineapple GKI)..."
          cd workspace
          
          # Fix the SOURCE_DATE_EPOCH warnings
          export SOURCE_DATE_EPOCH=$(date +%s)
          
          ./kernel_platform/build_with_bazel.py -t pineapple gki

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-Pad-2-Kernel-Output
          path: workspace/out/
          
