name: Build OnePlus Pad 2 NetHunter Kernel (Bazel)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile OnePlus Pad 2 Kernel (SM8650)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Clearing up disk space for the massive build environment..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install Build Dependencies and Repo Tool
        run: |
          echo "Installing essential build tools, cross-compilers, and Google Repo..."
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential crossbuild-essential-arm64 zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
          
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          
          # Fix the "repo not found" warning by symlinking to the global binary path
          sudo ln -sf ~/.bin/repo /usr/bin/repo
          sudo ln -sf ~/.bin/repo /bin/repo

      - name: Initialize and Sync OnePlus Kernel Manifest (Pure Local Setup)
        run: |
          echo "Setting up workspace using your local custom manifest..."
          
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          mkdir local_manifest_repo
          cd local_manifest_repo
          git init
          cp ../configs/oneplus_pad2_v.txt default.xml
          git add default.xml
          git commit -m "Custom OnePlus Pad 2 Manifest"
          cd ..
          
          mkdir workspace
          cd workspace
          repo init -u ../local_manifest_repo
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Patch KernelSU-Next
        run: |
          echo "Injecting KernelSU-Next..."
          cd workspace/kernel_platform/common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Inject Custom NetHunter Configurations Safely
        run: |
          echo "Merging NetHunter configs and disabling GKI defconfig checks..."
          cd workspace/kernel_platform/common
          
          # 1. Combine your custom text files into a single master fragment
          cat ${{ github.workspace }}/configs/nethunter-base.txt ${{ github.workspace }}/configs/nethunter-network.txt ${{ github.workspace }}/configs/snapdragon8-gen3-optimize.txt ${{ github.workspace }}/configs/security-hardening.txt > nethunter.config
          
          # 2. Use the kernel's built-in tool to cleanly merge the fragment and avoid symbol warnings
          ARCH=arm64 scripts/kconfig/merge_config.sh arch/arm64/configs/gki_defconfig nethunter.config
          
          # 3. Generate a minimized defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- savedefconfig
          
          # 4. Overwrite the original GKI config with our clean, merged version
          cp defconfig arch/arm64/configs/gki_defconfig
          
          # 5. CRITICAL FIX: Disable Google's strict GKI defconfig check to prevent the savedefconfig mismatch error
          echo "Hunting down and disabling POST_DEFCONFIG_CMDS checks..."
          find . -type f -name "build.config*" -exec sed -i 's/POST_DEFCONFIG_CMDS="check_defconfig"/POST_DEFCONFIG_CMDS=""/g' {} +

      - name: Build Kernel with Bazel
        run: |
          echo "Starting Bazel compilation for Snapdragon 8 Gen 3 (Pineapple GKI)..."
          cd workspace
          
          # Fix the SOURCE_DATE_EPOCH warnings
          export SOURCE_DATE_EPOCH=$(date +%s)
          
          ./kernel_platform/build_with_bazel.py -t pineapple gki

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-Pad-2-Kernel-Output
          path: workspace/out/
          
